name: Suggest a change to a verse
description: Better wording, a mistake, or something unclear in the text.
title: "Verse: "
labels: ["text"]
body:
  - type: input
    id: reference
    attributes:
      label: Verse or verses
      placeholder: John 3:16
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording
      description: Filled in by the app. Leave it as it is.
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: How would you put it? Write out the whole verse, or just the words you'd change.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: What reads wrong, is unclear, or misses the meaning? Mention the Hebrew, Greek or another translation if it helps.
